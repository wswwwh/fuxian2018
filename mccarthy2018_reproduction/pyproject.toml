[project]
name = "mccarthy2018-reproduction"
version = "0.1.0"
description = "Reproduction code for McCarthy 2018 quasi-periodic orbit thesis."
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.1",
  "pandas==2.3.3",
  "matplotlib==3.10.7",
  "pillow==12.0.0",
  "pypdf==6.13.3",
  "pymupdf==1.27.2.3",
  "skyfield==1.54",
]

[tool.setuptools.packages.find]
where = ["src"]
